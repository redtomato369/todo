<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TODO</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>TODO</h1>

    <form id="todo-form">
      <input
        id="todo-input"
        type="text"
        placeholder="할 일을 입력하세요"
        autocomplete="off"
        required
      >
      <button type="submit">추가</button>
    </form>

    <ul id="todo-list"></ul>

    <footer>
      <span id="todo-count"></span>
      <button id="clear-done" type="button">완료된 항목 지우기</button>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
